name: Test GitHub App commit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout with App token
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure App bot account
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"

          git config user.name "${APP_SLUG}[bot]"
          git config user.email \
            "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Create test commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> github-app-test.txt

          git add github-app-test.txt
          git commit -m "Test GitHub App commit"
          git push